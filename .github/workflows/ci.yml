name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build MaRa.Api.csproj
      - run: dotnet test tests/MaRa.Api.Tests/MaRa.Api.Tests.csproj
